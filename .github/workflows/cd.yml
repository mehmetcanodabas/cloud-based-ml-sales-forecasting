name: Azure ML CD

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Select Azure ML operation"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - batch-inference

permissions:
  id-token: write
  contents: read

jobs:
  azure-ml:
    name: Azure ML Manual Workflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure ML CLI extension
        run: |
          az extension add --name ml --yes

      - name: Validate Azure ML connection
        run: |
          az ml workspace show \
            --name mlw-sales-forecasting \
            --resource-group rg-cloud-based-ml-sales-forecasting \
            --output table

          az ml model show \
            --name cloud-retail-lightgbm \
            --version 1 \
            --workspace-name mlw-sales-forecasting \
            --resource-group rg-cloud-based-ml-sales-forecasting \
            --output table

      - name: Set up Python
        if: inputs.operation == 'batch-inference'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install inference dependencies
        if: inputs.operation == 'batch-inference'
        run: |
          python -m pip install azure-ai-ml azure-identity

      - name: Submit Azure ML batch inference
        if: inputs.operation == 'batch-inference'
        run: |
          python azure/run_inference.py
